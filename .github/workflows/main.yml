name: Push to prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION:     us-east4
  REPO:       emails
  IMAGE:      ${{ secrets.GCP_PROJECT_ID }}/emails:${{ github.sha }}
  NEXT_PUBLIC_BASE_URL_V3: https://api-v3-production-zyiwplqi4q-uk.a.run.app
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout source
      - uses: actions/checkout@v4

      # 2) Authenticate to GCP using your service account key
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3) Install & configure gcloud
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 4) Configure Docker to push to Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${REGION}-docker.pkg.dev \
            --quiet

      # 5) Install dependencies & build Next.js
      - name: Install & Build
        run: |
          yarn
          yarn run build

      # 6) Build & push container image
      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            us-east4-docker.pkg.dev/${{ env.IMAGE }}

      # 7) Trigger Portainer redeploy via webhook
      - name: Trigger Portainer Deploy
        if: 
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" \
            -H "X-API-Key: ${{ secrets.PORTAINER_KEY }}"
